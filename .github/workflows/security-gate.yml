# ng-runner-policy: trusted-hosted-or-private-jit-v1
name: Security gate
on:
  push:
    branches: [main]
  # pull_request_target loads this workflow from the trusted base branch. PR
  # content is checked out only as data and built on disposable fork JIT runners.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit to scan as read-only data
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
env:
  # Use the trusted target branch SHA for policy checkout; keep PR head refs out
  # of every actions/checkout ref field in this privileged workflow.
  SECURITY_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
concurrency:
  group: security-gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  status-pending:
    name: Start exact source status
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'
      ) ||
      (
        github.event_name != 'pull_request_target' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'snapetech' && (inputs.ref == '' || inputs.ref == github.sha)) ||
          github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Mark the exact source commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR_TARGET: ${{ github.event_name == 'pull_request_target' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ "$IS_PR_TARGET" == true ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            [[ "$current_sha" == "$SOURCE_SHA" ]]
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending -f context='Security audit' \
            -f description='Source and 12 image scans are running' \
            -f "target_url=$TARGET_URL"

  scan-trusted:
    name: Source scan (trusted)
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'snapetech' &&
        github.event.pull_request.user.type != 'Bot'
      ) ||
      (
        github.event_name != 'pull_request_target' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'snapetech' && (inputs.ref == '' || inputs.ref == github.sha)) ||
          github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)
        )
      )
    needs: [status-pending]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SECURITY_POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Verify trusted policy revision
        env:
          POLICY_SHA: ${{ env.SECURITY_POLICY_SHA }}
        run: test "$(git -C policy rev-parse HEAD)" = "$POLICY_SHA"
      - name: Run the base-controlled source scan
        uses: ./policy/.github/actions/security-source-scan
        with:
          source-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          source-sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          policy-sha: ${{ env.SECURITY_POLICY_SHA }}

  scan-untrusted:
    name: Source scan (isolated fork JIT)
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'snapetech' &&
        github.event.pull_request.user.type != 'Bot')
    needs: [status-pending]
    runs-on:
      group: public-fork-jit
      labels: [self-hosted, linux, x64, public-pr-chaptarrng, "ng-public-run-${{ github.run_id }}"]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SECURITY_POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Verify trusted policy revision
        env:
          POLICY_SHA: ${{ env.SECURITY_POLICY_SHA }}
        run: test "$(git -C policy rev-parse HEAD)" = "$POLICY_SHA"
      - name: Run the base-controlled source scan
        uses: ./policy/.github/actions/security-source-scan
        with:
          source-repository: ${{ github.event.pull_request.head.repo.full_name }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          policy-sha: ${{ env.SECURITY_POLICY_SHA }}

  container-images-trusted:
    name: Container image scan (${{ matrix.image }})
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'snapetech' &&
        github.event.pull_request.user.type != 'Bot'
      ) ||
      (
        github.event_name != 'pull_request_target' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'snapetech' && (inputs.ref == '' || inputs.ref == github.sha)) ||
          github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)
        )
      )
    needs: [status-pending]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: product-amd64
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: product-arm64
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu: false
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: product-armv7
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/arm/v7
            runner: ubuntu-24.04
            qemu: true
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: docker-build-input
            dockerfile: Dockerfile.build
            target: deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: docker-build-optimized-input
            dockerfile: Dockerfile.build.optimized
            target: dotnet-deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: cross-builder-input
            dockerfile: Dockerfile.cross
            target: deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: m4b-test
            dockerfile: integration/Dockerfile.m4b-test
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: node-fixture
            dockerfile: integration/Dockerfile.node-fixture
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: x86-handoff-fixture
            dockerfile: integration/standalone-handoff/Dockerfile.x86
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: python-fixture
            dockerfile: integration/Dockerfile.python-fixture
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: qbittorrent-fixture
            dockerfile: integration/acquisition/Dockerfile.qbittorrent
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: musl-handoff-fixture
            dockerfile: integration/standalone-handoff/Dockerfile.musl
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SECURITY_POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Verify trusted policy revision
        env:
          POLICY_SHA: ${{ env.SECURITY_POLICY_SHA }}
        run: test "$(git -C policy rev-parse HEAD)" = "$POLICY_SHA"
      - name: Rebuild and scan the exact source image
        uses: ./policy/.github/actions/security-image-scan
        with:
          source-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          source-sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          policy-sha: ${{ env.SECURITY_POLICY_SHA }}
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          install-qemu: ${{ matrix.qemu }}
          qemu-platforms: ${{ matrix.platform == 'linux/arm64' && 'arm64' || matrix.platform == 'linux/arm/v7' && 'arm' || matrix.platform == 'linux/386' && '386' || '' }}
          fresh-stages: ${{ matrix.fresh_stages }}
          no-cache: ${{ matrix.no_cache }}

  container-images-untrusted:
    name: Container image scan (${{ matrix.image }})
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'snapetech' &&
        github.event.pull_request.user.type != 'Bot')
    needs: [status-pending]
    runs-on:
      group: public-fork-jit
      labels: [self-hosted, linux, x64, public-pr-chaptarrng, "ng-public-run-${{ github.run_id }}"]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: product-amd64
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: product-arm64
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu: false
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: product-armv7
            dockerfile: Dockerfile.cross
            target: chaptarrng-standard
            platform: linux/arm/v7
            runner: ubuntu-24.04
            qemu: true
            fresh_stages: mp4v2,hardened-tools,chaptarrng-standard
            no_cache: false
          - image: docker-build-input
            dockerfile: Dockerfile.build
            target: deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: docker-build-optimized-input
            dockerfile: Dockerfile.build.optimized
            target: dotnet-deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: cross-builder-input
            dockerfile: Dockerfile.cross
            target: deps
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: m4b-test
            dockerfile: integration/Dockerfile.m4b-test
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: node-fixture
            dockerfile: integration/Dockerfile.node-fixture
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: x86-handoff-fixture
            dockerfile: integration/standalone-handoff/Dockerfile.x86
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: python-fixture
            dockerfile: integration/Dockerfile.python-fixture
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: qbittorrent-fixture
            dockerfile: integration/acquisition/Dockerfile.qbittorrent
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
          - image: musl-handoff-fixture
            dockerfile: integration/standalone-handoff/Dockerfile.musl
            target: ''
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
            fresh_stages: ''
            no_cache: true
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scan policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SECURITY_POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Verify trusted policy revision
        env:
          POLICY_SHA: ${{ env.SECURITY_POLICY_SHA }}
        run: test "$(git -C policy rev-parse HEAD)" = "$POLICY_SHA"
      - name: Rebuild and scan the exact source image
        uses: ./policy/.github/actions/security-image-scan
        with:
          source-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          source-sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          policy-sha: ${{ env.SECURITY_POLICY_SHA }}
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
          install-qemu: ${{ matrix.platform != 'linux/amd64' }}
          qemu-platforms: ${{ matrix.platform == 'linux/arm64' && 'arm64' || matrix.platform == 'linux/arm/v7' && 'arm' || matrix.platform == 'linux/386' && '386' || '' }}
          fresh-stages: ${{ matrix.fresh_stages }}
          no-cache: ${{ matrix.no_cache }}

  status:
    name: Record exact source result
    needs: [status-pending, scan-trusted, scan-untrusted, container-images-trusted, container-images-untrusted]
    if: >-
      always() && !cancelled() &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'main'
        ) ||
        (
          github.event_name != 'pull_request_target' &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'snapetech' && (inputs.ref == '' || inputs.ref == github.sha)) ||
            github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)
          )
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SECURITY_POLICY_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the exact PR head and all 12 image jobs before setting success
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR_TARGET: ${{ github.event_name == 'pull_request_target' }}
          TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.user.type != 'Bot' }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_USER: ${{ github.event.pull_request.user.login }}
          EVENT_USER_TYPE: ${{ github.event.pull_request.user.type }}
          TRUSTED_SCAN_RESULT: ${{ needs.scan-trusted.result }}
          UNTRUSTED_SCAN_RESULT: ${{ needs.scan-untrusted.result }}
          TRUSTED_IMAGES_RESULT: ${{ needs.container-images-trusted.result }}
          UNTRUSTED_IMAGES_RESULT: ${{ needs.container-images-untrusted.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          state=failure
          description='Source or image scan failed'
          if [[ "$IS_PR_TARGET" == true ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .head.sha, (.head.repo.full_name // ""), .user.login, .user.type] | @tsv')"
            IFS=$'\t' read -r pr_state base_ref current_sha current_repo current_user current_user_type <<< "$pr_data"
            if [[ "$pr_state" != open || "$base_ref" != main || "$current_sha" != "$SOURCE_SHA" || "$current_repo" != "$EVENT_HEAD_REPO" || "$current_user" != "$EVENT_USER" || "$current_user_type" != "$EVENT_USER_TYPE" ]]; then
              description='PR head changed or is no longer eligible'
            elif [[ "$TRUSTED_PR" == true && "$TRUSTED_SCAN_RESULT" == success && "$TRUSTED_IMAGES_RESULT" == success && "$UNTRUSTED_SCAN_RESULT" == skipped && "$UNTRUSTED_IMAGES_RESULT" == skipped ]]; then
              state=success
            elif [[ "$TRUSTED_PR" != true && "$UNTRUSTED_SCAN_RESULT" == success && "$UNTRUSTED_IMAGES_RESULT" == success && "$TRUSTED_SCAN_RESULT" == skipped && "$TRUSTED_IMAGES_RESULT" == skipped ]]; then
              state=success
            fi
          elif [[ "$TRUSTED_SCAN_RESULT" == success && "$TRUSTED_IMAGES_RESULT" == success && "$UNTRUSTED_SCAN_RESULT" == skipped && "$UNTRUSTED_IMAGES_RESULT" == skipped ]]; then
            state=success
          fi

          if [[ "$state" == success ]]; then
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | {name, conclusion}]')"
            python3 scripts/verify_security_image_scan_jobs.py "$jobs_json"
            description='Source and all 12 image scans passed'
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f "state=$state" -f context='Security audit' \
            -f "description=$description" -f "target_url=$TARGET_URL"
