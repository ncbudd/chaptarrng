name: Security audit status
on:
  workflow_run:
    workflows: [Security gate]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  record-pr-status:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Record the read-only scan result on the exact PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXPECTED_IMAGE_SCANS: '12'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          image_jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("Container image scan")) | .conclusion')"
          image_count="$(printf '%s\n' "$image_jobs" | sed '/^$/d' | wc -l)"
          state=failure
          if [[ "$RUN_CONCLUSION" == success && "$image_count" == "$EXPECTED_IMAGE_SCANS" ]] \
            && ! grep -qv '^success$' <<<"$image_jobs"; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f "state=$state" -f context='Security audit' \
            -f "description=Source scan: $RUN_CONCLUSION; image scans: $image_count/$EXPECTED_IMAGE_SCANS" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
