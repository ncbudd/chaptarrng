name: Rebuild and scan an exact ChaptarrNG image input
description: Build one unpublished image from an exact source commit and scan it with pinned Trivy.
inputs:
  source-repository:
    description: Repository containing the exact source revision.
    required: true
  source-sha:
    description: Exact 40-character source commit to build.
    required: true
  policy-sha:
    description: Exact base-controlled policy commit.
    required: true
  image:
    description: Stable matrix image identifier.
    required: true
  dockerfile:
    description: Dockerfile path relative to the source root.
    required: true
  target:
    description: Optional Docker build target.
    required: false
    default: ''
  platform:
    description: Target OCI platform.
    required: true
  qemu-platforms:
    description: QEMU platforms to install when the runner is not native.
    required: false
    default: ''
  install-qemu:
    description: Whether to install QEMU before building.
    required: false
    default: 'false'
  fresh-stages:
    description: Build stages to rebuild without cache.
    required: false
    default: ''
  no-cache:
    description: Disable all build cache for this image.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate exact source and policy revisions
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        POLICY_SHA: ${{ inputs.policy-sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        [[ "$POLICY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        test "$(git -C policy rev-parse HEAD)" = "$POLICY_SHA"
    - name: Checkout exact source revision as build data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ inputs.source-repository }}
        ref: ${{ inputs.source-sha }}
        path: source
        persist-credentials: false
    - name: Verify checked out source revision
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
    - name: Validate scanner suppressions and prepare pinned Trivy database
      shell: bash
      run: |
        set -euo pipefail
        python3 policy/scripts/check-scan-suppressions.py policy source
        docker pull aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/container-scan"
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache \
          --mount "type=bind,src=$RUNNER_TEMP/trivy-cache,dst=/cache" \
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
          image --cache-dir /cache --download-db-only
        test -s "$RUNNER_TEMP/trivy-cache/db/trivy.db"
        test -s "$RUNNER_TEMP/trivy-cache/db/metadata.json"
    - name: Install QEMU for cross-platform image builds
      if: inputs.install-qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: ${{ inputs.qemu-platforms }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build exact image without publishing or shared caches
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ./source
        file: ./source/${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        tags: local/chaptarrng-${{ inputs.image }}:${{ github.run_id }}
        load: true
        pull: true
        no-cache: ${{ inputs.no-cache }}
        no-cache-filters: ${{ inputs.fresh-stages }}
        provenance: false
        sbom: false
    - name: Save built image for offline scanning
      shell: bash
      env:
        IMAGE: local/chaptarrng-${{ inputs.image }}:${{ github.run_id }}
      run: docker save --output "$RUNNER_TEMP/container-scan/image.tar" "$IMAGE"
    - name: Scan rebuilt image for active HIGH and CRITICAL vulnerabilities
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image }}
      run: |
        set -euo pipefail
        docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
          --read-only --pids-limit 256 --memory 4g --tmpfs /tmp:rw,nosuid,nodev,size=1g \
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache \
          --mount "type=bind,src=$RUNNER_TEMP/trivy-cache,dst=/cache" \
          --mount "type=bind,src=$RUNNER_TEMP/container-scan/image.tar,dst=/image.tar,readonly" \
          --mount "type=bind,src=$PWD/policy/.trivyignore.yaml,dst=/trivyignore.yaml,readonly" \
          --mount "type=bind,src=$RUNNER_TEMP/container-scan,dst=/reports" \
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
          image --cache-dir /cache --skip-db-update --skip-java-db-update --skip-check-update \
            --ignorefile /trivyignore.yaml --show-suppressed --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 20m \
            --format json --output "/reports/${IMAGE_NAME}.json" --input /image.tar
    - name: Retain image scan report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: image-scan-${{ inputs.image }}-${{ github.run_id }}
        path: ${{ runner.temp }}/container-scan/${{ inputs.image }}.json
        if-no-files-found: ignore
        retention-days: 14
